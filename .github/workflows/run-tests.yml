name: Run Web Automation Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      group_payments_ui:
        description: 'Run payments-ui tests'
        type: boolean
        default: true
      group_workbench_ui:
        description: 'Run workbench-ui tests'
        type: boolean
        default: false
      group_common:
        description: 'Run common tests'
        type: boolean
        default: false
      group_regression:
        description: 'Run regression tests'
        type: boolean
        default: false
      group_sanity:
        description: 'Run sanity tests'
        type: boolean
        default: false
      group_negative:
        description: 'Run negative tests'
        type: boolean
        default: false
      group_hrms:
        description: 'Run HRMS tests'
        type: boolean
        default: false
      group_complaint:
        description: 'Run Complaint tests'
        type: boolean
        default: false
      test_class:
        description: 'Specific test class to run (e.g., tests.LoginTest)'
        required: false
        default: ''
      test_method:
        description: 'Specific test method to run (e.g., verifyUserCanLogin)'
        required: false
        default: ''
      environment:
        description: 'Environment to use (UAT or DEMO)'
        required: true
        type: choice
        options:
          - UAT
          - DEMO
  repository_dispatch:
    types: [trigger-tests]

jobs:
  test:
    runs-on: ubuntu-22.04
    # workflow_dispatch uses the selected environment; push/repository_dispatch uses UAT
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'UAT' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install dependencies
        run: mvn clean install -DskipTests

      - name: Install Playwright browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install chromium"

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2 \
            libxshmfence1

      - name: Set test groups
        id: test-config
        run: |
          groups=""
          add_group() {
            if [ -n "$groups" ]; then groups="$groups,$1"; else groups="$1"; fi
          }
          [ "${{ github.event.inputs.group_payments_ui }}"  == "true" ] && add_group "payments-ui"
          [ "${{ github.event.inputs.group_workbench_ui }}" == "true" ] && add_group "workbench-ui"
          [ "${{ github.event.inputs.group_common }}"       == "true" ] && add_group "common"
          [ "${{ github.event.inputs.group_regression }}"   == "true" ] && add_group "regression"
          [ "${{ github.event.inputs.group_sanity }}"       == "true" ] && add_group "sanity"
          [ "${{ github.event.inputs.group_negative }}"     == "true" ] && add_group "negative"
          [ "${{ github.event.inputs.group_hrms }}"         == "true" ] && add_group "HRMS"
          [ "${{ github.event.inputs.group_complaint }}"    == "true" ] && add_group "Complaint"
          # push to main (non-dispatch) always runs the default groups
          if [ -z "$groups" ]; then groups="payments-ui,workbench-ui"; fi
          echo "groups=$groups" >> $GITHUB_OUTPUT
          echo "Test groups to run: $groups"

      - name: Create .env file
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BROWSER: ${{ vars.BROWSER || secrets.BROWSER }}
          HEADLESS: ${{ vars.HEADLESS || secrets.HEADLESS }}
          COUNTRY: ${{ vars.COUNTRY || secrets.COUNTRY }}
          STATE: ${{ vars.STATE || secrets.STATE }}
          LGA: ${{ vars.LGA || secrets.LGA }}
          WARD: ${{ vars.WARD || secrets.WARD }}
          VILLAGE: ${{ vars.VILLAGE || secrets.VILLAGE }}
          AREA: ${{ vars.AREA || secrets.AREA }}
          CAMPAIGN_TYPE: ${{ vars.CAMPAIGN_TYPE || secrets.CAMPAIGN_TYPE }}
        run: |
          echo "Debug: BASE_URL is set: $([ -n "$BASE_URL" ] && echo 'YES' || echo 'NO')"

          echo "Using ${{ github.event.inputs.environment || 'UAT' }} environment"
          {
            echo "BASE_URL=$BASE_URL"
            echo "BROWSER=${BROWSER:-chromium}"
            echo "HEADLESS=${HEADLESS:-true}"
            echo "USERNAME=$USERNAME"
            echo "PASSWORD=$PASSWORD"
            echo "COUNTRY=$COUNTRY"
            echo "STATE=$STATE"
            echo "LGA=$LGA"
            echo "WARD=$WARD"
            echo "VILLAGE=$VILLAGE"
            echo "AREA=$AREA"
            echo "CAMPAIGN_TYPE=$CAMPAIGN_TYPE"
          } > .env

          echo "Generated .env file:"
          cat .env | sed 's/PASSWORD=.*/PASSWORD=***/' | sed 's/USERNAME=.*/USERNAME=***/' | sed 's/BASE_URL=.*/BASE_URL=***/'
          echo ""
          echo "Verify .env file exists:"
          ls -la .env

      - name: Validate .env file
        run: |
          echo "Validating .env file..."
          missing=0
          for key in BASE_URL USERNAME COUNTRY STATE; do
            value=$(grep "^$key=" .env | cut -d'=' -f2)
            if [ -z "$value" ]; then
              echo "ERROR: $key is empty in .env file"
              missing=1
            else
              echo "OK: $key is set"
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "FAILED: Required environment variables are missing. Check GitHub secrets."
            exit 1
          fi
          echo "Validation passed."

      - name: Display environment info
        run: |
          echo "=========================================="
          echo "  TEST EXECUTION ENVIRONMENT"
          echo "=========================================="
          echo "Environment  : ${{ github.event.inputs.environment || 'UAT' }}"
          echo "Test Groups  : ${{ steps.test-config.outputs.groups }}"
          if [ -n "${{ github.event.inputs.test_class }}" ]; then
            echo "Test Class   : ${{ github.event.inputs.test_class }}"
          fi
          if [ -n "${{ github.event.inputs.test_method }}" ]; then
            echo "Test Method  : ${{ github.event.inputs.test_method }}"
          fi
          echo ""
          echo "-- Non-sensitive config (store as Variables, not Secrets) --"
          echo "BROWSER      : ${{ vars.BROWSER || 'chromium' }}"
          echo "HEADLESS     : ${{ vars.HEADLESS || 'true' }}"
          echo "COUNTRY      : ${{ vars.COUNTRY }}"
          echo "STATE        : ${{ vars.STATE }}"
          echo "LGA          : ${{ vars.LGA }}"
          echo "WARD         : ${{ vars.WARD }}"
          echo "VILLAGE      : ${{ vars.VILLAGE }}"
          echo "AREA         : ${{ vars.AREA }}"
          echo ""
          echo "-- Sensitive config (Secrets - intentionally masked) --"
          echo "BASE_URL     : [MASKED]"
          echo "USERNAME     : [MASKED]"
          echo "PASSWORD     : [MASKED]"
          echo "=========================================="
          echo ""

      - name: Run tests
        run: mvn test -Dtest.groups="${{ steps.test-config.outputs.groups }}"
        continue-on-error: true
        env:
          CI: true

      - name: Test summary
        if: always()
        run: |
          report_dir="target/surefire-reports"
          total=0; passed=0; failed=0; errors=0; skipped=0
          if ls "$report_dir"/TEST-*.xml 1>/dev/null 2>&1; then
            for f in "$report_dir"/TEST-*.xml; do
              t=$(grep -o 'tests="[0-9]*"'    "$f" | grep -o '[0-9]*' | head -1)
              fl=$(grep -o 'failures="[0-9]*"' "$f" | grep -o '[0-9]*' | head -1)
              e=$(grep -o 'errors="[0-9]*"'   "$f" | grep -o '[0-9]*' | head -1)
              s=$(grep -o 'skipped="[0-9]*"'  "$f" | grep -o '[0-9]*' | head -1)
              total=$((total   + ${t:-0}))
              failed=$((failed + ${fl:-0}))
              errors=$((errors + ${e:-0}))
              skipped=$((skipped + ${s:-0}))
            done
            passed=$((total - failed - errors - skipped))
            echo "[INFO] ========================================"
            echo "[INFO]   TEST RESULTS SUMMARY"
            echo "[INFO] ========================================"
            echo "[INFO] Tests run : $total"
            echo "[INFO] Passed    : $passed"
            echo "[INFO] Failures  : $failed"
            echo "[INFO] Errors    : $errors"
            echo "[INFO] Skipped   : $skipped"
            echo "[INFO] ========================================"
          else
            echo "[INFO] No surefire XML reports found in $report_dir"
          fi

      - name: List screenshots
        if: always()
        run: |
          echo "Checking for screenshots in workspace..."
          find ${{ github.workspace }} -name "*.png" -type f || echo "No PNG files found"
          ls -la ${{ github.workspace }}/screenshots/ 2>/dev/null || echo "screenshots/ directory not found"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: ${{ github.workspace }}/**/FAILED_*.png
          if-no-files-found: ignore
